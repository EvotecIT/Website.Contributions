name: Validate Contributions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contributions
        uses: actions/checkout@v7
        with:
          path: contributions

      - name: Checkout PowerForge engine
        uses: actions/checkout@v7
        with:
          repository: EvotecIT/PSPublishModule
          path: engine

      - name: Setup .NET
        uses: EvotecIT/PSPublishModule/.github/actions/setup-dotnet@6d2eef9cb69e2d93f89e7f22e9c39fa294260d19
        with:
          dotnet-version: "10.0.x"

      - name: Build PowerForge.Web
        shell: bash
        run: |
          dotnet build engine/PowerForge.Web.Cli/PowerForge.Web.Cli.csproj -c Release -f net10.0

      - name: Validate contribution bundles
        shell: bash
        run: |
          dotnet engine/PowerForge.Web.Cli/bin/Release/net10.0/PowerForge.Web.Cli.dll contributions validate --root contributions --fail-on-warnings
